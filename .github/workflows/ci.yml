name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 显示工具链版本
        run: |
          xcodebuild -version
          swift --version

      - name: 运行单元测试
        run: ./scripts/test.sh

      - name: 编译应用与小组件扩展
        run: NO_SIGN=1 ./scripts/build.sh

      - name: 确认小组件扩展已被嵌入
        run: |
          # 产物名是中文「大模型额度.app」，这里不写死，直接从 dist 里取。
          APP=$(ls -d dist/*.app | head -1)
          echo "产物：$APP"
          test -d "$APP/Contents/PlugIns/QuotaWidget.appex"
          test -f "$APP/Contents/PlugIns/QuotaWidget.appex/Contents/Info.plist"
          echo "小组件扩展已嵌入"